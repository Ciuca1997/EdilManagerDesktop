name: Release

# Si avvia quando fai push di un tag tipo v1.0.1: git tag v1.0.1 && git push --tags
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    env:
      # Repo pubblico che contiene solo le Release; deve coincidere con RepoUrl in UpdateService.cs
      RELEASES_REPO: https://github.com/Ciuca1997/EdilManager-releases
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Versione dal tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish
        run: dotnet publish EdilManager.Desktop -c Release -r win-x64 --self-contained "-p:Version=$env:VERSION" -o publish

      - name: Installa vpk
        run: dotnet tool install -g vpk --version 1.2.161

      # Serve per generare gli aggiornamenti "delta"; alla prima release non c'è nulla da scaricare
      - name: Scarica release precedenti
        continue-on-error: true
        run: vpk download github --repoUrl $env:RELEASES_REPO --token ${{ secrets.RELEASES_TOKEN }}

      - name: Pack
        run: vpk pack --packId EdilManager --packVersion $env:VERSION --packDir publish --mainExe EdilManager.exe

      - name: Pubblica la Release
        run: vpk upload github --repoUrl $env:RELEASES_REPO --publish --releaseName "EdilManager $env:VERSION" --tag "v$env:VERSION" --token ${{ secrets.RELEASES_TOKEN }}
